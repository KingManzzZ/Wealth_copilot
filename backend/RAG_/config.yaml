# ============================================================
# 个人财富规划 RAG 模块 — 全局配置
# 说明：路径均相对于本文件所在目录解析；所有切分参数与 PLAN.md 4.2 节对齐
# ============================================================

paths:
  data_dir: ./data              # 原始知识文档目录
  db_dir: ./db                  # Qdrant 本地数据目录
  models_dir: ./models          # 本地模型目录（存在同名子目录时优先使用本地模型）
  cache_dir: ./cache            # tiktoken / jieba 等缓存目录

device: auto                    # auto | cuda | cpu（auto：有 NVIDIA GPU 时用 cuda，否则 cpu）

embedding:
  model: Qwen/Qwen3-Embedding-0.6B
  dim: 1024                     # 支持 MRL 降维（如 512），变更需 --rebuild 重建
  max_length: 8192
  batch_size: 8
  # Qwen3-Embedding 为 instruction-aware：仅查询侧加指令前缀，文档侧不加
  # 指令保持语言中立（中英文查询通用）
  instruct: "Given a financial question, retrieve relevant passages that answer the question"

rerank:
  enabled: true
  model: Qwen/Qwen3-Reranker-0.6B
  max_length: 4096
  batch_size: 8
  instruct: "Given a financial query, retrieve passages that answer the query"  # 语言中立（中英文查询通用）

sparse:
  method: qdrant_sparse         # qdrant_sparse（Qdrant 稀疏向量+IDF，原生 RRF）| jieba_bm25（本地 BM25+应用层 RRF）
  k1: 1.5                       # 仅 jieba_bm25 使用（BM25 参数）
  b: 0.75

retrieval:
  dense_top: 30                 # 稠密召回数量
  sparse_top: 30                # 稀疏召回数量
  fused_top: 20                 # RRF 融合后进入重排的候选数
  final_top: 8                  # 最终返回证据块数
  rrf_k: 60                     # RRF 常数（应用层融合时使用）
  rerank_weight: 0.6            # 重排分在最终融合中的权重（0=纯 RRF，1=纯重排）
  rerank_floor: 0.25            # 重排最高分低于该阈值 → 判定重排不可靠，退回 RRF 排序（泛查询保底）
  no_answer_threshold: 0.05     # 重排最高分低于该阈值 → 判定库中无相关证据（结果标记 low_confidence）
  dedupe_by_parent: true        # 按 parent_id / heading_path 去重，保证召回多样性

chunking:
  max_tokens: 512               # 子块上限（tiktoken cl100k_base），对齐 RAGFlow chunk_token_num 默认值
  delimiters: "\n!?。；！？"     # 分隔符，对齐 RAGFlow naive 默认 delimiter
  heading_max_level: 7          # 允许的最大**语义层级**（1=章 … 7=第X条）；不再约束 Markdown 的 # 数量
  overlap_tokens: 0             # 块间重叠 token 数（0 = 不重叠；>0 时在 _merge_segments 中真正生效）
  breadcrumb: true              # 面包屑注入（标题路径前缀，提升嵌入与关键词匹配上下文）
  include_doc_title: true       # 面包屑首层是否带文档标题。注意：会给同文档所有块加同一常量前缀，
                                # 轻度压缩稠密向量区分度，跨文档消歧时才有收益 —— 请用评估集确认
  running_header_min_count: 3   # 标题重复 ≥N 次且近似 doc_title → 判为页眉并整行丢弃
  drop_contents: true           # 删除目录区块（目录标题进入跳过模式 + 目录表格识别）
  title_rules: true             # 中文标题语义层级识别 + 伪标题过滤（not_title）
  min_chunk_chars: 30           # 小于该长度的块并入同节相邻块（纯噪声块直接丢弃）
  merge_documents: true         # 识别合订本中的文书边界（如「XX条例」）并重置层级栈

parsing:
  page_break_placeholder: "<!--PAGEBREAK-->"   # PDF 页码标记（解析时插入，用于页码溯源）
  pdf_engine: auto             # PDF 解析引擎：auto（Docling 优先，失败自动回退）| docling | pymupdf
  # PDF 的 CID→Unicode 映射表损坏时产生的乱码汉字（系统性错误，非随机）。
  # 它们插在词与词之间，会同时破坏分词（BM25 失配）与标题正则。
  # 处理方式：整体替换为空格以恢复词边界。⚠️ 字符表是语料相关的，
  # 若某字在语料中也是合法用字会被误删，建议用字体统计确认后再固化。
  garbled_chars: "摇郾也冶页盂藔"